{% extends "base.html" %}

{% block title %}
  Delete Service
{% endblock %}

{% block content %}
  <h2>Delete Service</h2>

  <p>
    Are you sure you want to delete
    <strong>{{ service }}</strong>?
  </p>

  <form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
      Delete
    </button>

    <a href="{% url 'store:service-list' %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
