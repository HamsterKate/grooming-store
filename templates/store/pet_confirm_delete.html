{% extends "base.html" %}

{% block title %}
  <div class="text-danger fw-bold">!?! Delete pet !?!</div>
{% endblock %}
{% block subtitle %}{% endblock %}

{% block content %}
	<div class="col-12 py-4 px-5 text-center text-danger fw-bold">
	  Are you sure you want to delete<br />
	  <strong>{{ object }}</strong>?
	</div>

  <form method="post">
    {% csrf_token %}

    <div class="d-flex justify-content-center">

	    <a href="{% url 'store:groomer-list' %}" class="btn bg-gradient-success w-auto me-1 mb-0">
	      Cancel
	    </a>

	    <button type="submit" class="btn bg-gradient-danger w-auto me-1 mb-0">
	      Delete
	    </button>
		</div>
  </form>
{% endblock %}
