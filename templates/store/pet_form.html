{% extends "base.html" %}

{% block content %}
  <h2>Pet form</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
      Save
    </button>
  </form>

  <hr>

  <a href="{% url 'store:pet-list' %}" class="btn btn-secondary">
    Back to list
  </a>

  {% if object %}
    <a href="{% url 'store:pet-delete' object.pk %}" class="btn btn-danger">
      Delete
    </a>
  {% endif %}

{% endblock %}
