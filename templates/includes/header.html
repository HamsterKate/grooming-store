<div class="container position-sticky z-index-sticky top-0">
  <div class="row">
    <div class="col-12">
      <nav class="navbar blur blur-rounded shadow position-absolute my-3 py-2 start-0 end-0 mx-4">
        <div class="container-fluid d-flex align-items-center justify-content-between">

				  <!-- ================= LEFT: MENU ================= -->
				  <div class="flex-shrink-0 d-flex align-items-center">
				    <div class="dropdown">
				      <a class="nav-link d-flex align-items-center px-0 py-0"
				         href="#"
				         data-bs-toggle="dropdown">
				        <i class="fa fa-bars me-2"></i>
				        <span class="small fw-semibold">Menu</span>
				      </a>
				      <ul class="dropdown-menu shadow-sm">
				        <li><a class="dropdown-item" href="{% url 'store:index' %}">Home</a></li>
				        <li><a class="dropdown-item" href="{% url 'store:groomer-list' %}">Groomers</a></li>
				        <li><a class="dropdown-item" href="{% url 'store:service-list' %}">Services</a></li>
				        <li><a class="dropdown-item" href="{% url 'store:pet-list' %}">Pets</a></li>
				      </ul>
				    </div>
				  </div>

					{% if search_form %}
					<!-- ================= CENTER: SEARCH ================= -->
					<div class="flex-grow-1 mx-4 d-flex align-items-center justify-content-center">

					  <form method="get"
					        class="d-flex align-items-center gap-2 w-100"
					        style="max-width: 600px;">

					    {% if search_form.field %}
					      <div class="flex-shrink-0" style="width: 160px;">
					        {{ search_form.field }}
					      </div>
					    {% endif %}

					    <div class="flex-grow-1">
					      {{ search_form.query }}
					    </div>

					  </form>

					</div>
					{% endif %}

					<!-- ================= RIGHT: USER ================= -->
					<div class="flex-shrink-0 d-flex align-items-center">

					  {% if user.is_authenticated %}

					    <div class="d-flex flex-column align-items-end">

					      <span class="nav-link px-0 py-0">
					        {{ user.username }}
					      </span>

					      <a href="/accounts/logout/"
					         class="nav-link px-0 py-0 text-muted">
					        Logout
					      </a>

					    </div>

					  {% else %}

					    <a href="{% url 'login' %}"
					       class="nav-link px-2 py-1">
					      Login
					    </a>

					  {% endif %}

					</div>

				</div>
      </nav>
    </div>
  </div>
</div>
