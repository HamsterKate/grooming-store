{% extends "base.html" %}

{% block content %}
	<h1>Service Info</h1>
  <p><strong>Service:</strong>
    {{ service.name }}
  </p>

  <p><strong>Service Type: </strong>{{ service.service_type }}</p>
  <p><strong>Description:</strong></p>
  {% if service.description %}
  	<i>{{ service.description }}</i>
    {% else %}
    <i>Sorry... Description will be added soon</i>
  {% endif %}
{% endblock %}
