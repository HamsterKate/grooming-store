{% extends "base.html" %}

{% block title %}Form{% endblock %}
{% block subtitle %}Editor{% endblock %}

{% block content %}
<div class="col-12 py-4 px-5">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <small class="text-danger d-block">
            {{ field.errors|striptags }}
          </small>
        {% endif %}
      </div>
    {% endfor %}
    <div class="d-flex justify-content-between mt-4">
      <a href="{{ back_url }}" class="btn btn-outline-secondary">Cancel</a>
      <button class="btn bg-gradient-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
